# Hello World's database (ADR-005). One command: docker compose up -d
# The scripts in migrations/ run once, in order, when the data volume is empty.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: hello
      POSTGRES_USER: ${POSTGRES_USER:-hello_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?set API_DB_PASSWORD in .env}
    ports:
      - "47103:5432"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d hello"]
      interval: 2s
      retries: 15

volumes:
  data:
